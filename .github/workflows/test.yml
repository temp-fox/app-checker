name: test run (small batch)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'appinfo.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: install dependence
        run: npm i -g pnpm && pnpm i --no-frozen-lockfile

      - name: install playwright
        run: npx playwright install chromium

      - name: generate RSS (small batch, auto-update like)
        run: npm run rss
        env:
          TEST_APP_LIMIT: '2'

      - name: show git diff summary
        run: |
          echo "=== git status ==="
          git status -s || true
          echo "=== changed files ==="
          git diff --name-only || true

      - name: show result summary
        run: |
          echo "=== RSS result ==="
          ls -lh rss/cn.xml
          head -30 rss/cn.xml
