name: cleanup

on:
  workflow_dispatch:
    inputs:
      before_date:
        description: '日期 (YYYY-MM-DD)。不填则删除所有主仓库 Action 记录；填写则删除该日期之前的：① 主仓库 Action 记录 ② Issues ③ 主仓库 Deployments（该日期当天不删）'
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PUBLISH_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const currentRunId = context.runId
            const inputDate = '${{ inputs.before_date }}'
            const beforeDate = inputDate ? new Date(inputDate + 'T00:00:00Z') : null
            console.log(beforeDate
              ? `Deleting workflow runs created before ${beforeDate.toISOString().split('T')[0]}`
              : 'Deleting all workflow runs')

            let deleted = 0
            let skipped = 0
            let scanned = 0
            let eligible = 0
            let reportedTotal = null
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo,
                per_page: 100,
                page: 1
              })
              if (reportedTotal === null) {
                reportedTotal = data.total_count
                console.log(`main repo total workflow runs visible to token: ${reportedTotal}`)
              }
              if (data.workflow_runs.length === 0) break

              let deletedThisPage = 0
              let remainingEligibleOnPage = 0
              for (const run of data.workflow_runs) {
                scanned++
                if (run.id === currentRunId) continue
                const createdAt = new Date(run.created_at)
                if (beforeDate && createdAt >= beforeDate) continue
                eligible++
                if (['in_progress', 'queued', 'waiting'].includes(run.status)) {
                  console.log(`Skipped run ${run.id} (${run.name}): ${run.status}`)
                  skipped++
                  continue
                }
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id })
                  deleted++
                  deletedThisPage++
                } catch (e) {
                  remainingEligibleOnPage++
                  console.log(`Failed to delete run ${run.id}: ${e.message}`)
                }
              }

              if (deletedThisPage === 0) {
                if (remainingEligibleOnPage === 0) break
                throw new Error(`Unable to delete ${remainingEligibleOnPage} eligible workflow runs from the first page`)
              }
            }
            console.log(`Done. Scanned ${scanned} runs, eligible ${eligible}. Deleted ${deleted} workflow runs, skipped ${skipped}`)

      - name: Close and delete issues before date
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PUBLISH_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const inputDate = '${{ inputs.before_date }}'
            if (!inputDate) {
              console.log('No date provided. Skipping issues cleanup')
              return
            }
            const beforeDate = new Date(inputDate + 'T00:00:00Z')
            console.log(`Deleting issues created before ${beforeDate.toISOString().split('T')[0]}`)

            let deleted = 0
            let page = 1
            while (true) {
              const issues = await github.rest.issues.listForRepo({
                owner, repo,
                state: 'all',
                per_page: 100,
                page,
                since: '2000-01-01T00:00:00Z'
              })
              if (issues.data.length === 0) break
              for (const issue of issues.data) {
                if (issue.pull_request) continue
                const createdAt = new Date(issue.created_at)
                if (createdAt >= beforeDate) continue
                try {
                  if (issue.state === 'open') {
                    await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
                  }
                  await github.rest.issues.delete({ owner, repo, issue_number: issue.number })
                  deleted++
                } catch (e) {
                  console.log(`Failed to delete issue #${issue.number}: ${e.message}`)
                }
              }
              if (issues.data.length < 100) break
              page++
            }
            console.log(`Done. Deleted ${deleted} issues`)

      - name: Delete deployments before date
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PUBLISH_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const inputDate = '${{ inputs.before_date }}'
            if (!inputDate) {
              console.log('No date provided. Skipping deployments cleanup')
              return
            }
            const beforeDate = new Date(inputDate + 'T00:00:00Z')
            console.log(`Deleting deployments created before ${beforeDate.toISOString().split('T')[0]}`)

            let deleted = 0
            let page = 1
            while (true) {
              const { data } = await github.rest.repos.listDeployments({
                owner, repo,
                per_page: 100,
                page
              })
              if (data.length === 0) break
              for (const deployment of data) {
                const createdAt = new Date(deployment.created_at)
                if (createdAt >= beforeDate) continue
                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner, repo,
                    deployment_id: deployment.id,
                    state: 'inactive'
                  })
                  await github.rest.repos.deleteDeployment({
                    owner, repo,
                    deployment_id: deployment.id
                  })
                  deleted++
                } catch (e) {
                  console.log(`Failed to delete deployment ${deployment.id}: ${e.message}`)
                }
              }
              if (data.length < 100) break
              page++
            }
            console.log(`Done. Deleted ${deleted} deployments`)
