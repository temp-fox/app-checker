name: auto update

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

concurrency:
  group: auto-update-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}
          # Full history so rebase after a long generate still works.
          fetch-depth: 0

      - name: install dependence
        run: npm i -g pnpm && pnpm i --no-frozen-lockfile

      - name: install playwright
        run: npx playwright install chromium

      - name: generate RSS and push notifications
        run: npm run rss
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DING_TALK_BOT_TOKEN: ${{ secrets.DING_TALK_BOT_TOKEN }}

      - name: commit the all info
        id: commit_msg
        run: |
          if git status -s | grep -q .; then
            echo "Changes detected, committing..."
            git status -s
            echo "check_result=success" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            exit 0
          fi
          git config --global user.email "temp-fox@users.noreply.github.com"
          git config --global user.name "temp-fox"
          git add .
          git commit -m 'chore: automatic update of GitHub workflow'

      - name: git pull and push
        if: steps.commit_msg.outputs.check_result == 'success'
        run: |
          set -euo pipefail

          # Generated data commits should always win over intermediate remote updates.
          # During rebase, "-X theirs" means the commit being replayed (this run).
          push_with_rebase_retry() {
            local remote_branch="$1"
            local max_attempts=8
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Push attempt ${attempt}/${max_attempts}"
              git fetch origin "$remote_branch"

              if ! git rebase -X theirs "origin/${remote_branch}"; then
                echo "Rebase failed even with -X theirs"
                git rebase --abort || true
                return 1
              fi

              if git push origin "HEAD:${remote_branch}"; then
                echo "Push succeeded"
                return 0
              fi

              echo "Push rejected (raced with another commit); retrying..."
              attempt=$((attempt + 1))
              sleep $((attempt * 2))
            done

            echo "Exhausted ${max_attempts} push attempts"
            return 1
          }

          push_with_rebase_retry main
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: checkout pages repo
        if: success()
        uses: actions/checkout@v4
        with:
          repository: temp-fox/app-checker-page
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app-checker-page
          fetch-depth: 0

      - name: sync data files to pages repo
        if: success()
        run: |
          mkdir -p app-checker-page/data
          cp apps.json app-checker-page/data/apps.json
          cp src/data/storage/rss.json app-checker-page/data/rss.json
          if ls src/data/storage/cn-0.json >/dev/null 2>&1; then
            cp src/data/storage/cn-*.json src/data/storage/cn-index.json app-checker-page/data/
          elif [ -f src/data/storage/cn.json ]; then
            cp src/data/storage/cn.json app-checker-page/data/cn.json
          fi
          cp src/data/storage/daily-stats.json app-checker-page/data/daily-stats.json

      - name: commit and push pages repo data
        if: success()
        run: |
          set -euo pipefail
          cd app-checker-page

          push_with_rebase_retry() {
            local remote_branch="$1"
            local max_attempts=8
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Pages data push attempt ${attempt}/${max_attempts}"
              git fetch origin "$remote_branch"

              if ! git rebase -X theirs "origin/${remote_branch}"; then
                echo "Pages data rebase failed even with -X theirs"
                git rebase --abort || true
                return 1
              fi

              if git push origin "HEAD:${remote_branch}"; then
                echo "Pages data push succeeded"
                return 0
              fi

              echo "Pages data push rejected; retrying..."
              attempt=$((attempt + 1))
              sleep $((attempt * 2))
            done

            echo "Exhausted ${max_attempts} pages data push attempts"
            return 1
          }

          if git status -s -- data/apps.json data/rss.json data/cn-index.json data/cn-*.json data/daily-stats.json | grep -q .; then
            git config user.email "temp-fox@users.noreply.github.com"
            git config user.name "temp-fox"
            git add data/apps.json data/rss.json data/cn-index.json data/cn-*.json data/daily-stats.json
            git commit -m "chore: sync upstream data from ${GITHUB_SHA}"
            push_with_rebase_retry main
          else
            echo "No pages data changes to commit"
          fi

      - name: update pages live snapshot
        if: success()
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          // Keep pages archive under GitHub's 100MB single-file hard limit.
          // Frontend RECENT_WINDOW_DAYS is 30; 60 days leaves headroom for history pages.
          const MAX_ARCHIVE_SNAPSHOTS = 60
          const MAX_FILE_BYTES = 95 * 1024 * 1024

          const pagesRoot = path.resolve('app-checker-page')
          const rssPath = path.join(pagesRoot, 'data', 'rss.json')
          const dailyStatsPath = path.join(pagesRoot, 'data', 'daily-stats.json')
          const liveSnapshotPath = path.join(pagesRoot, 'data', 'live-snapshot.json')
          const archiveSnapshotsPath = path.join(pagesRoot, 'data', 'daily-archive-snapshots.json')

          function readJson(filePath, fallback) {
            if (!fs.existsSync(filePath)) {
              return fallback
            }

            try {
              return JSON.parse(fs.readFileSync(filePath, 'utf8'))
            } catch (error) {
              throw new Error(`failed to parse ${filePath}: ${error.message}`)
            }
          }

          function writeJson(filePath, value) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true })
            // Compact JSON: pretty-print roughly doubles archive size over time.
            fs.writeFileSync(filePath, `${JSON.stringify(value)}\n`, 'utf8')
          }

          function getTimestampMs(value) {
            const timestamp = Number(value)
            return Number.isFinite(timestamp) ? timestamp : 0
          }

          function getDateKey(timestamp) {
            const numericTimestamp = getTimestampMs(timestamp)
            if (!numericTimestamp) {
              return ''
            }

            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(new Date(numericTimestamp))

            const partMap = {}
            for (const part of parts) {
              if (part.type !== 'literal') {
                partMap[part.type] = part.value
              }
            }

            return `${partMap.year}-${partMap.month}-${partMap.day}`
          }

          function collapseSupportedDevices(devices) {
            if (!Array.isArray(devices) || devices.length === 0) {
              return []
            }

            const set = new Set()
            for (const device of devices) {
              const text = String(device || '')
              if (!text) continue
              if (text.includes('iPhone')) set.add('iPhone')
              else if (text.includes('iPad')) set.add('iPad')
              else if (text.includes('Watch')) set.add('Apple Watch')
              else if (text.startsWith('AppleTV')) set.add('Apple TV')
              else if (text.startsWith('iPod')) set.add('iPod touch')
              else if (text.startsWith('Mac') || text.startsWith('Desktop')) set.add('Mac')
            }
            return Array.from(set)
          }

          function slimAppForArchive(app) {
            if (!app || typeof app !== 'object') {
              return null
            }

            const trackId = app.trackId ?? app.adamId
            if (trackId === undefined || trackId === null || trackId === '') {
              return null
            }

            const screenshotUrls = Array.isArray(app.screenshotUrls)
              ? app.screenshotUrls.filter(Boolean).slice(0, 2)
              : []
            const ipadScreenshotUrls = Array.isArray(app.ipadScreenshotUrls)
              ? app.ipadScreenshotUrls.filter(Boolean).slice(0, 2)
              : []
            const discounts = Array.isArray(app.discounts)
              ? app.discounts
                  .filter(Boolean)
                  .map((discount) => ({
                    type: discount.type,
                    name: discount.name,
                    from: discount.from,
                    to: discount.to,
                    range: discount.range,
                  }))
              : []

            const slimmed = {
              trackId,
              trackName: app.trackName || app.name || '',
              name: app.name || app.trackName || '',
              summaryDescription: app.summaryDescription || app.description || '',
              description: app.description || app.summaryDescription || '',
              artworkUrl100: app.artworkUrl100 || '',
              trackViewUrl: app.trackViewUrl || '',
              artistName: app.artistName || '',
              sellerName: app.sellerName || '',
              primaryGenreName: app.primaryGenreName || '',
              kind: app.kind || '',
              timestamp: getTimestampMs(app.timestamp) || undefined,
              discounts,
              genres: Array.isArray(app.genres) ? app.genres.filter(Boolean) : [],
              screenshotUrls,
              ipadScreenshotUrls,
              supportedDevices: collapseSupportedDevices(app.supportedDevices),
            }

            if (app.adamId !== undefined && app.adamId !== null && app.adamId !== '' && app.adamId !== trackId) {
              slimmed.adamId = app.adamId
            }

            // Drop empty optional fields to shrink JSON further.
            for (const key of Object.keys(slimmed)) {
              const value = slimmed[key]
              if (value === undefined || value === '') {
                delete slimmed[key]
              } else if (Array.isArray(value) && value.length === 0) {
                delete slimmed[key]
              }
            }

            return slimmed
          }

          function normalizeSnapshot(snapshot) {
            if (!snapshot || getTimestampMs(snapshot.timestamp) <= 0 || !Array.isArray(snapshot.cn)) {
              return null
            }

            const timestamp = getTimestampMs(snapshot.timestamp)
            const dateKey = String(snapshot.dateKey || '').trim() || getDateKey(timestamp)
            if (!dateKey) {
              return null
            }

            const cn = snapshot.cn
              .map((app) => slimAppForArchive(app))
              .filter(Boolean)

            if (cn.length === 0) {
              return null
            }

            return {
              dateKey,
              timestamp,
              cn,
            }
          }

          function capArchiveSnapshots(snapshots) {
            const byDateKey = new Map()
            for (const snapshot of snapshots) {
              if (!snapshot || !snapshot.dateKey) continue
              const existing = byDateKey.get(snapshot.dateKey)
              if (!existing || snapshot.timestamp > existing.timestamp) {
                byDateKey.set(snapshot.dateKey, snapshot)
              }
            }

            return Array.from(byDateKey.values())
              .sort((left, right) => right.timestamp - left.timestamp)
              .slice(0, MAX_ARCHIVE_SNAPSHOTS)
          }

          function assertUnderLimit(filePath) {
            const size = fs.statSync(filePath).size
            const sizeMb = (size / 1024 / 1024).toFixed(2)
            console.log(`${path.basename(filePath)} size: ${sizeMb} MB (${size} bytes)`)
            if (size > MAX_FILE_BYTES) {
              throw new Error(
                `${path.basename(filePath)} is ${sizeMb} MB, exceeds safety limit ${MAX_FILE_BYTES / 1024 / 1024} MB (GitHub hard limit is 100 MB)`,
              )
            }
          }

          const rss = readJson(rssPath, { cn: [] })
          const rssApps = Array.isArray(rss)
            ? rss
            : Array.isArray(rss && rss.cn)
              ? rss.cn
              : []
          const previousLiveSnapshot = normalizeSnapshot(readJson(liveSnapshotPath, null))
          const rawArchiveSnapshots = readJson(archiveSnapshotsPath, [])
          const archiveSnapshots = Array.isArray(rawArchiveSnapshots)
            ? rawArchiveSnapshots.map((snapshot) => normalizeSnapshot(snapshot)).filter(Boolean)
            : []
          const currentDateKey = getDateKey(Date.now())

          let nextArchiveSnapshots = archiveSnapshots
          if (previousLiveSnapshot && previousLiveSnapshot.cn.length > 0 && previousLiveSnapshot.dateKey !== currentDateKey) {
            nextArchiveSnapshots = [
              previousLiveSnapshot,
              ...archiveSnapshots.filter((snapshot) => snapshot.dateKey !== previousLiveSnapshot.dateKey),
            ]
          }
          nextArchiveSnapshots = capArchiveSnapshots(nextArchiveSnapshots)

          const dailyStats = readJson(dailyStatsPath, [])
          const latestDailyStat = Array.isArray(dailyStats)
            ? dailyStats
              .filter((snapshot) => getTimestampMs(snapshot && snapshot.timestamp) > 0)
              .sort((left, right) => getTimestampMs(right.timestamp) - getTimestampMs(left.timestamp))[0]
            : null
          const latestDailyStatTimestamp = getTimestampMs(latestDailyStat && latestDailyStat.timestamp)
          const liveTimestamp = getDateKey(latestDailyStatTimestamp) === currentDateKey
            ? latestDailyStatTimestamp
            : Date.now()

          const nextLiveSnapshot = normalizeSnapshot({
            dateKey: currentDateKey,
            timestamp: liveTimestamp,
            cn: rssApps,
          }) || {
            dateKey: currentDateKey,
            timestamp: liveTimestamp,
            cn: [],
          }

          writeJson(liveSnapshotPath, nextLiveSnapshot)
          writeJson(archiveSnapshotsPath, nextArchiveSnapshots)

          console.log(
            `archive snapshots kept: ${nextArchiveSnapshots.length}/${MAX_ARCHIVE_SNAPSHOTS}; ` +
              `live apps: ${nextLiveSnapshot.cn.length}`,
          )
          assertUnderLimit(liveSnapshotPath)
          assertUnderLimit(archiveSnapshotsPath)
          NODE

      - name: commit and push pages snapshots
        if: success()
        run: |
          set -euo pipefail
          cd app-checker-page
          git config user.email "temp-fox@users.noreply.github.com"
          git config user.name "temp-fox"
          ls -lah data/live-snapshot.json data/daily-archive-snapshots.json
          git add -f data/live-snapshot.json data/daily-archive-snapshots.json
          if git diff --cached --quiet; then
            echo "No pages snapshot changes to commit"
          else
            git commit -m "chore: sync live/archive snapshots from ${GITHUB_SHA}"

            push_with_rebase_retry() {
              local remote_branch="$1"
              local max_attempts=8
              local attempt=1

              while [ "$attempt" -le "$max_attempts" ]; do
                echo "Pages snapshot push attempt ${attempt}/${max_attempts}"
                git fetch origin "$remote_branch"

                if ! git rebase -X theirs "origin/${remote_branch}"; then
                  echo "Pages snapshot rebase failed even with -X theirs"
                  git rebase --abort || true
                  return 1
                fi

                if git push origin "HEAD:${remote_branch}"; then
                  echo "Pages snapshot push succeeded"
                  return 0
                fi

                echo "Pages snapshot push rejected; retrying..."
                attempt=$((attempt + 1))
                sleep $((attempt * 2))
              done

              echo "Exhausted ${max_attempts} pages snapshot push attempts"
              return 1
            }

            push_with_rebase_retry main
          fi
